
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report an Issue | CampusPulse</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-body">

    <div class="auth-container">

        <h1 class="auth-logo">CampusPulse</h1>

        <div class="auth-card">

            <h2>Report a Campus Issue</h2>

            {% if message %}
                <p style="padding: 12px; background-color: #e8f5e9;
                          color: #1b5e20; border-radius: 6px;">
                    {{ message }}
                </p>
            {% endif %}

            <form action="/report-issue" method="POST"
                  enctype="multipart/form-data">

                <label>Issue Title</label>
                <input type="text" name="title"
                       placeholder="Enter issue title" required>

                <label>Description</label>
                <textarea name="description"
                          placeholder="Describe the problem"
                          required></textarea>

                <label>Campus Location</label>
                <input type="text" name="location"
                       placeholder="Enter location" required>

                <label>Upload Photo (Optional)</label>
                <input type="file" name="photo"
                       accept="image/*">

                <button type="submit" class="auth-button">
                    Submit Complaint
                </button>

            </form>

            <p><a href="/student-dashboard">Back to Dashboard</a></p>

        </div>
    </div>

</body>
</html>
